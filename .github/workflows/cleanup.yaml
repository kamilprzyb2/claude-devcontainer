name: cleanup

on:
  schedule:
    - cron: "0 6 * * 1"   # an hour after the rebuild
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: claude-dev
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true

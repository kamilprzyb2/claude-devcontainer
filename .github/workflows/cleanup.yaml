name: cleanup

on:
  schedule:
    - cron: "0 6 * * 1"   # an hour after the rebuild
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only log what would be deleted
        type: boolean
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Every release keeps its own MAJOR.MINOR.PATCH tag, so anything untagged
      # is a leftover (e.g. an interrupted push) and safe to remove.
      #
      # Multi-arch aware: the amd64/arm64 manifests inside a tagged image are
      # untagged too, and this action knows not to touch them.
      # actions/delete-package-versions doesn't, and would break every image.
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: claude-dev
          delete-untagged: true
          validate: true
          # Scheduled runs have no inputs, so this is false there
          dry-run: ${{ inputs.dry-run == true }}

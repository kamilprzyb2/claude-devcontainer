name: cleanup

on:
  schedule:
    - cron: "0 6 * * 1"   # an hour after the rebuild
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Multi-arch aware: counts whole images (index + platform manifests) and
      # never deletes the platform manifests a tagged image still points to.
      # actions/delete-package-versions treats every manifest as a separate
      # version, which both skews the count and can break old tags like :1.
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: claude-dev
          keep-n-untagged: 10
          validate: true
